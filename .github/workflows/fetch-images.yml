# One-off helper: copies the images still hotlinked from the old WordPress
# site into images/ and points the pages at the local copies.
name: Fetch images from WordPress
on:
  workflow_dispatch:
  push:
    paths: ['.missing-images']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and relink
        run: |
          set -e
          mkdir -p images
          while read -r url; do
            [ -z "$url" ] && continue
            f=images/$(basename "$url")
            curl -fsSL -o "$f" "$url"
            for page in $(grep -rl --include=index.html -F "$url" .); do
              case "$page" in
                ./index.html) prefix="images/" ;;
                *) prefix="../images/" ;;
              esac
              sed -i "s#$url#$prefix$(basename "$url")#g" "$page"
            done
          done < .missing-images
          : > .missing-images
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Copy images from WordPress into the repo"
          git push
